{% extends "base.html" %}
{% block title %}Owner Login — Land Reserve{% endblock %}
{% block body_class %}bg-form-premium{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-140px)] flex items-center justify-center px-4 py-12">

  <div class="max-w-md w-full">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-primary flex items-center justify-center shadow-lg shadow-primary/20">
        <i class="bi bi-house-fill text-3xl text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">Land Owner Access</h1>
      <p class="text-white text-lg">Secure login for land owners</p>
    </div>

    <!-- Login Form -->
    <div class="backdrop-blur-lg rounded-2xl p-8 shadow-2xl" style="background-color: rgba(26, 92, 56, 0.9); border: 2px solid rgba(26, 92, 56, 0.8);">
      <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
          <label for="username" class="block text-sm font-medium text-white mb-2">
            <i class="bi bi-person-fill mr-2"></i>Username
          </label>
          <input type="text" id="username" name="username" required
                 class="w-full px-4 py-3 rounded-lg text-gray-900 font-medium focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all"
                 style="background-color: rgba(255, 255, 255, 0.95); border: 2px solid rgba(26, 92, 56, 0.6);"
                 placeholder="Enter owner username">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-white mb-2">
            <i class="bi bi-lock-fill mr-2"></i>Password
          </label>
          <div class="relative">
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-3 rounded-lg text-gray-900 font-medium focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all pr-10"
                   style="background-color: rgba(255, 255, 255, 0.95); border: 2px solid rgba(26, 92, 56, 0.6);"
                   placeholder="Enter owner password">
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#1a5c38] transition-colors" onclick="togglePasswordVisibility('password', 'ownerPasswordIcon')">
              <i class="bi bi-eye-fill" id="ownerPasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit"
                class="w-full bg-primary text-white font-semibold py-3 px-4 rounded-lg hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-primary-light focus:ring-offset-2 focus:ring-offset-green-900 transition-all transform hover:scale-105">
          <i class="bi bi-box-arrow-in-right mr-2"></i>Access Owner Dashboard
        </button>
      </form>

      <!-- Back to main site -->
      <div class="mt-6 text-center">
        <a href="{% url 'lands:browse_lands' %}" class="text-white hover:text-primary-light transition-colors font-medium">
          <i class="bi bi-arrow-left mr-1"></i>Back to Main Site
        </a>
      </div>
    </div>
  </div>
</div>

<script>
// Password visibility toggle
function togglePasswordVisibility(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  
  if (!input || !icon) return;
  
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('bi-eye-fill');
    icon.classList.add('bi-eye-slash-fill');
  } else {
    input.type = 'password';
    icon.classList.remove('bi-eye-slash-fill');
    icon.classList.add('bi-eye-fill');
  }
}
</script>
{% endblock %}
